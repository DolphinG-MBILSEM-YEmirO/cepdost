<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed version for maskable icons and the Play Store: the
       launcher or the store cuts the shape, so the art stays inside the
       central safe zone (80%). -->
  <rect width="512" height="512" fill="#C93A1A"/>
  <g transform="translate(256 256) scale(0.8)">
    <circle cx="-58" cy="0" r="92" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <circle cx="58" cy="0" r="92" fill="none" stroke="#FFFFFF" stroke-width="40" opacity="0.72"/>
  </g>
</svg>
