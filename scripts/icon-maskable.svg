<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed version for maskable icons and the Play Store: the
       launcher or the store cuts the shape, so the art stays inside the
       central safe zone (80%). -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.48" stop-color="#4A5CF0"/>
      <stop offset="1" stop-color="#7B5CF5"/>
    </linearGradient>
    <radialGradient id="isik" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#zemin)"/>
  <rect width="512" height="512" fill="url(#isik)"/>
  <g transform="translate(256 256) scale(0.8)">
    <circle r="152" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.24"/>
    <path d="M-96 0 L-6 -84 L-6 -30 L100 -30 L100 30 L-6 30 L-6 84 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
