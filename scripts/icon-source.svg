<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sharloop app icon: the brand gradient (orange, pink,
       violet) with two linked white rings, people looped into one plan. -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset="0.5" stop-color="#F5317A"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#zemin)"/>
  <g transform="translate(256 256)">
    <circle cx="-58" cy="0" r="92" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <circle cx="58" cy="0" r="92" fill="none" stroke="#FFFFFF" stroke-width="40" opacity="0.72"/>
  </g>
</svg>
