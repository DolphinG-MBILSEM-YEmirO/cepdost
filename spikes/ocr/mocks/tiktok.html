<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 900px; height: 700px;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(circle at 70% 30%, #402020 0%, transparent 50%),
      radial-gradient(circle at 20% 70%, #1a2a3a 0%, transparent 55%),
      linear-gradient(160deg, #111 0%, #000 100%);
    position: relative;
    overflow: hidden;
  }
  .bottom {
    position: absolute; left: 28px; right: 110px; bottom: 48px;
    color: white;
  }
  .handle {
    font-weight: 700; font-size: 24px; margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .caption {
    font-size: 25px; line-height: 1.5; font-weight: 500;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .music {
    margin-top: 16px; font-size: 19px; color: #ddd; font-weight: 400;
  }
</style>
</head>
<body>
  <div class="bottom">
    <div class="handle">@lezzetduragi</div>
    <div class="caption">Bu tarifi mutlaka denemelisiniz! Sarımsaklı makarna sadece 15 dakikada hazır 🍝🔥 Malzemeler: makarna, sarımsak, tereyağı, kırmızı pul biber</div>
    <div class="music">♪ orijinal ses - lezzetduragi</div>
  </div>
</body>
</html>
