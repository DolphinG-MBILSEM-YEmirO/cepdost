# Builds the Sharloop Android app (Capacitor shell with the home-screen
# widgets, see mobile/) and publishes the APK as a GitHub release, so it can
# be downloaded and installed on a phone without Android Studio.
#
# Runs on every push to main that touches mobile/ or the widget data, and by
# hand from the Actions tab ("Run workflow"). Work branches (claude/**) are
# built too, as a check, but only main publishes a release.

name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'mobile/**'
      - 'src/widgets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/apply-native.mjs android

      - name: App icon from the web app's icon
        working-directory: mobile
        continue-on-error: true
        run: |
          # icon-background.png (plain white) is kept in mobile/assets.
          cp ../public/icons/icon-512.png assets/icon-only.png
          cp ../public/icons/icon-512-maskable.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'

      - name: Build the APK
        working-directory: mobile/android
        run: |
          # The shared debug key, so each new APK installs over the last one.
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Sharloop.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sharloop-apk
          path: Sharloop.apk

      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ github.run_number }}"
          gh release create "$tag" Sharloop.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Sharloop Android (test sürümü ${{ github.run_number }})" \
            --notes "Telefona kurmak için Sharloop.apk dosyasını indirip açın. Ana ekran widget'ları: ana ekrana basılı tutun → Widget'lar → Sharloop."
