# Builds the Sharloop Android app for Google Play: a release App Bundle
# (.aab), signed with the upload key once it is in the repo's secrets.
# The test APK for installing by hand stays in android-apk.yml.
#
# Secrets (Settings → Secrets and variables → Actions), steps in
# mobile/MAGAZA.md:
#   ANDROID_UPLOAD_KEYSTORE           the upload keystore (.jks), base64
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  its password
#   ANDROID_UPLOAD_KEY_ALIAS          the key's alias (e.g. upload)
#   ANDROID_UPLOAD_KEY_PASSWORD       the key's password (often the same)
#
# Without them the bundle is still built, unsigned, as a check. Each run's
# number is the version code, so every upload to Play is higher than the
# last; the version name comes from mobile/package.json.

name: Android release

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'mobile/**'
      - 'src/widgets/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_SIGNING: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/apply-native.mjs android

      - name: App icon from the web app's icon
        working-directory: mobile
        continue-on-error: true
        run: |
          cp ../public/icons/icon-512.png assets/icon-only.png
          cp ../public/icons/icon-512-maskable.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'

      - name: Build the release bundle
        working-directory: mobile/android
        run: |
          version_name=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PsharloopVersionCode=${{ github.run_number }} \
            -PsharloopVersionName="$version_name"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Sharloop.aab"
          echo "Built Sharloop $version_name (version code ${{ github.run_number }})"

      - name: Sign with the upload key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          jarsigner -keystore "$keystore" -storepass "$STORE_PASSWORD" \
            -keypass "${KEY_PASSWORD:-$STORE_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            Sharloop.aab "${KEY_ALIAS:-upload}"
          jarsigner -verify Sharloop.aab | tail -1
          rm -f "$keystore"

      - name: Note that the bundle is unsigned
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Release bundle built but not signed. Add the upload key secrets (mobile/MAGAZA.md) to get a bundle Google Play accepts."

      - uses: actions/upload-artifact@v4
        with:
          name: Sharloop-aab-${{ github.run_number }}
          path: Sharloop.aab
